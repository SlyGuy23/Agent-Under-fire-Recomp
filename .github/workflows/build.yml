name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Game files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          foreach ($x in 'default.xbe', 'bond_eng.xbe', 'driving.xbe') { Copy-Item "xbe/$x" "assets/$x" }

      - name: Build
        shell: pwsh
        run: |
          cmd /c build.bat 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # a failed build's log on the ci-log branch, readable with plain git
      - name: Publish log
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logpub | Out-Null
          Copy-Item build.log logpub/ -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse out -Filter *.log -ErrorAction SilentlyContinue | Select-Object -First 5 | Copy-Item -Destination logpub/
          cd logpub
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Failed build $($env:GITHUB_SHA.Substring(0,7))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      - name: Package
        shell: pwsh
        run: |
          $out = 'out/build/release'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\1*\x64\Microsoft.VC*.CRT" -Directory | Select-Object -Last 1
          # the top folder: AgentUnderFire.exe, which starts the game, and ROM, where the player's disc image goes;
          # everything else in Game Files
          $pkg = 'pkg'
          $files = "$pkg/Game Files"
          New-Item -ItemType Directory -Force $files | Out-Null
          $images = 'AgentUnderFire', 'AgentUnderFireGame', 'AgentUnderFireDriving'
          foreach ($i in $images) { Copy-Item "$out/$i.exe", "$out/$i.dll" $files }
          Copy-Item "$out/start/AgentUnderFire.exe" $pkg
          Copy-Item README.md, sdk/THIRD_PARTY.txt $files
          foreach ($f in 'msvcp140', 'vcruntime140', 'vcruntime140_1') { Copy-Item "$($crt.FullName)\$f.dll" $files }
          New-Item -ItemType Directory -Force "$pkg/ROM" | Out-Null
          Set-Content "$pkg/ROM/Put your Agent Under Fire ISO here.txt" 'Put your disc image of 007: Agent Under Fire (PAL, .iso) in this folder, then run AgentUnderFire.exe.'
          # each DLL must stay newer than its exe or the first start rebuilds it
          foreach ($i in $images) { (Get-Item "$files/$i.dll").LastWriteTime = (Get-Date).AddMinutes(1) }
          Compress-Archive -Path "$pkg/*" -DestinationPath AgentUnderFire.zip -CompressionLevel Optimal
          Get-ChildItem -Recurse $pkg | Format-Table FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: AgentUnderFire
          path: AgentUnderFire.zip

  # the finished build on the `builds` branch (one force-pushed commit), fetchable with plain git
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AgentUnderFire
      - name: Push to builds
        run: |
          mkdir pub && cd pub && unzip -q ../AgentUnderFire.zip && cp ../AgentUnderFire.zip .
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
