name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Game files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          foreach ($x in 'default.xbe', 'bond_eng.xbe', 'driving.xbe') { Copy-Item "xbe/$x" "assets/$x" }

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Package
        shell: pwsh
        run: |
          $out = 'out/build/release'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\1*\x64\Microsoft.VC*.CRT" -Directory | Select-Object -Last 1
          $pkg = 'pkg'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          $images = 'AgentUnderFire', 'AgentUnderFireGame', 'AgentUnderFireDriving'
          foreach ($i in $images) { Copy-Item "$out/$i.exe", "$out/$i.dll" $pkg }
          Copy-Item README.md, sdk/THIRD_PARTY.txt $pkg
          foreach ($f in 'msvcp140', 'vcruntime140', 'vcruntime140_1') { Copy-Item "$($crt.FullName)\$f.dll" $pkg }
          # each DLL must stay newer than its exe or the first start rebuilds it
          foreach ($i in $images) { (Get-Item "$pkg/$i.dll").LastWriteTime = (Get-Date).AddMinutes(1) }
          Compress-Archive -Path "$pkg/*" -DestinationPath AgentUnderFire.zip -CompressionLevel Optimal
          Get-ChildItem $pkg | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: AgentUnderFire
          path: AgentUnderFire.zip

  # the finished build on the `builds` branch (one force-pushed commit), fetchable with plain git
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AgentUnderFire
      - name: Push to builds
        run: |
          mkdir pub && cd pub && unzip -q ../AgentUnderFire.zip && cp ../AgentUnderFire.zip .
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
